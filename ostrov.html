/* ===================== ВРЕМЯ ===================== */
function fmt(m){return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")}
function drawClock(){$("clock").innerHTML=`День <b>${S.day}</b> из 3 · ${DAYS[S.day]} · <b>${fmt(S.min)}</b>`;
 $("bDiary").classList.toggle("new",!!S.newD);$("bFolder").classList.toggle("new",!!S.newF)}
function spend(c){if(S.ended)return;S.min+=c;if(S.min>=19*60){S.min=19*60;save();render();setTimeout(evening,250);return true}save();return false}

function evening(){
 if(S.day===3){boat();return}
 if(S.flags['eve'+S.day]){if(S.day===2&&!S.flags.tea2)evening2();else nextDayPrompt();return}
 S.flags['eve'+S.day]=1;
 if(S.day===1){
  S.flags.drug1=1;S.diary.push({d:1,txt:"Видел с маяка женщину на льду. Она помахала мне и ушла под лёд. Всё ясно. Завтра — подписать акт о несчастном случае.",drug:1});S.newD=1;
  full(`<div class="tag">ВЕЧЕР · 14 МАРТА</div><h1>Ужин</h1><p>Ольга Карповна ставит перед вами стакан чая с «травками» и ласково смотрит, как вы пьёте. Тепло, сонно… Дальше вы ничего не помните.</p><button class="btn" onclick="nextDay()">Утро →</button>`);
 }else evening2();
 save();
}
function nextDayPrompt(){full(`<div class="tag">НОЧЬ</div><h1>Остров спит</h1><button class="btn" onclick="nextDay()">Утро →</button>`)}
function evening2(){{
  full(`<div class="tag">ВЕЧЕР · 15 МАРТА</div><h1>Ужин</h1><p>Ольга Карповна снова несёт вам свой чай. «С травками, голубчик».</p><button class="btn" onclick="tea(1)">Выпить</button><button class="btn ghost" onclick="tea(0)">Незаметно вылить в фикус</button>`);
 }
 save();
}
function tea(drink){S.flags.tea2=1;
 if(drink){S.diary.push({d:2,txt:"Михеич — пьяница, в кочегарку не ходить. Ольга Карповна — надёжный человек. Акт подписать.",drug:1});S.newD=1;
  full(`<div class="tag">НОЧЬ</div><h1>Провал</h1><p>Стакан пустеет. Комната плывёт, кто-то говорит с вами тихим голосом… Утром вы ничего не помните.</p><button class="btn" onclick="nextDay()">Утро →</button>`)}
 else{give("night");S.flags.refused=1;
  full(`<div class="tag">НОЧЬ · 23:10</div><h1>Вы не спите</h1><p>Дверь тихо открывается. Ольга Карповна садится у вашей кровати с вашим же дневником и шепчет, что вам писать… Увидев открытые глаза, она поспешно уходит.</p><p class="paperhint">Запишите: что она пыталась вам продиктовать?</p><br><button class="btn" onclick="nextDay()">Утро →</button>`)}
 save();
}
function nextDay(){S.day++;S.min=8*60;S.loc="b";S.diary.push({d:S.day,txt:S.day===2?"Утро. В дневнике запись моим почерком, но я её не помню. Буквы плывут. Что со мной было вечером?":"Последний день. В 19:00 катер. Надо успеть.",own:1});
 S.newD=1;save();hideFull();render();toast(S.day===2?"В дневнике новая запись. Вы её не помните.":"День третий. Катер в 19:00.")}
function boat(){full(`<div class="tag">16 МАРТА · 19:00</div><h1>Катер у причала</h1><p>Лёд прошёл. Капитан машет с палубы: пора. Отчёт — сейчас.</p><button class="btn" onclick="hideFull();openReport(1)">Написать отчёт</button>`)}

/* ===================== ДЕЙСТВИЯ ===================== */
function move(k){if(S.ended)return;if(k===S.loc){return}S.loc=k;if(!spend(30))render()}
function give(k){if(!S.docs.includes(k)&&!S.items.includes(k)){if(k.startsWith("book_"))S.items.push(k);else S.docs.push(k);S.newF=1;save();drawClock()}}
function doAct(a){
 if(a.need&&!has(a.need)){toast("Сначала нужно понять, что искать.");return}
 if(a.fn){if(a.c&&!S.done.includes(a.id)){if(spend(a.c))return}a.fn();render();return}
 const first=!S.done.includes(a.id);
 if(first){S.done.push(a.id);if(a.doc)give(a.doc);if(a.then)a.then();if(a.c&&spend(a.c))return}
 if(a.doc)showDoc(a.doc);else if(a.then&&a.id.length<6)toast("Книга у вас в папке.");
 render();
}
function talk(pk){
 const p=PEOPLE[pk];const box=()=>{const qs=p.q.map((q,i)=>{const key=pk+"_q"+i;const ok=(!q.need||has(q.need))&&(!q.need2||has(q.need2));
   if(!ok)return"";return `<button class="${S.asked[key]?'used':''} ${q.press?'press':''}" onclick="ask('${pk}',${i})">${q.press?'⚑ ':''}${q.t}</button>`}).join("");
  return `<h3>${p.n}</h3><div class="sub">${LOCS[p.loc].n}</div><div class="chat" id="chat"><div class="say">${p.intro}</div></div><div class="qs">${qs}</div><p class="sub" style="margin-top:12px">⚑ — вопрос, который появился благодаря найденной улике. Каждый вопрос — 15 минут.</p>`};
 openM(box());
}
function ask(pk,i){
 const p=PEOPLE[pk],q=p.q[i],key=pk+"_q"+i;
 const firstTime=!S.asked[key];S.asked[key]=1;S.flags[key]=1;
 if(q.flag)S.flags[q.flag]=1;if(q.doc)give(q.doc);
 const ch=$("chat");ch.insertAdjacentHTML("beforeend",`<div class="me">${q.t}</div><div class="say">${q.a}${q.doc?` <i>(в папке: «${DOCS[q.doc].t}»)</i>`:""}</div>`);
 ch.lastElementChild.scrollIntoView({behavior:"smooth",block:"nearest"});
 save();
 if(firstTime&&spend(15)){closeM();return}
 render();
 if(q.flag==="veraFound"){setTimeout(()=>{closeM();full(`<div class="tag">КОЧЕГАРКА</div><h1>Она жива</h1><p>За котлом, на старом тюфяке, сидит худая девушка в огромных валенках. В руках — свёрток с вырванными страницами. «Вы ведь не их?» — спрашивает Вера.</p><button class="btn" onclick="hideFull();showDoc('vera')">Выслушать</button>`)},900)}
}

function lock(){
 if(has("trial")){showDoc("trial");return}
 openM(`<h3>Кабинет главврача</h3><div class="sub">Кодовый замок на четыре цифры.</div><div class="dials">${[0,1,2,3].map(i=>`<div class="dial"><button onclick="dial(${i},1)">▲</button><span id="dl${i}">0</span><button onclick="dial(${i},-1)">▼</button></div>`).join("")}</div><button class="btn" onclick="tryLock()">Повернуть ручку</button><div class="err" id="lerr"></div>`);
 window._dl=[0,0,0,0];
}
function dial(i,d){_dl[i]=(_dl[i]+d+10)%10;$("dl"+i).textContent=_dl[i]}
function tryLock(){if(_dl.join("")==="1205"){give("trial");S.done.push("safe");save();closeM();render();
  full(`<div class="tag">КАБИНЕТ ГЛАВВРАЧА</div><h1>Щелчок</h1><p>Дверь открывается. Сейф в кабинете не заперт — Штерн уверен, что сюда никто не войдёт. Внутри толстый журнал.</p><button class="btn" onclick="hideFull();showDoc('trial')">Читать</button>`)}
 else $("lerr").textContent="Не поддаётся. Где-то должна быть подсказка."}

function bookView(k){const B=BOOKS[k];let mi=0;const T=B.msg;
 const out=[...B.txt].map(ch=>{if(mi<T.length&&ch.toUpperCase()===T[mi]){mi++;return `<u>${ch}</u>`}return ch}).join("");
 return `<div class="doc">${out}</div>`}
function decode(){
 const got=["verne","defo","stev"].filter(k=>S.items.includes("book_"+k));
 if(!got.length){openM(`<h3>Стол библиотеки</h3><p>Разбирать пока нечего. У вас нет ни одной книги, которую читала Вера.</p>`);return}
 openM(`<h3>Пометки Веры</h3><div class="sub">В каждой книге карандашом подчёркнуты отдельные буквы. Порядок книг — по датам в формуляре.</div>
 ${got.map(k=>`<p style="margin:12px 0 4px"><b>${BOOKS[k].t}</b></p>${bookView(k)}`).join("")}
 ${got.length<3?`<p class="sub">Книг у вас ${got.length} из 3. Остальные надо найти.</p>`:""}
 <p style="margin-top:14px"><b>Что написала Вера?</b> Наберите всё послание без пробелов или с пробелами.</p>
 <input class="inp" id="cin" placeholder="…"><button class="btn" onclick="tryCipher()">Проверить</button><div class="err" id="cerr"></div>`);
}
function tryCipher(){const v=$("cin").value.toUpperCase().replace(/Ё/g,"Е").replace(/[^А-Я]/g,"");
 const full_="ЯУМИХЕИЧАСЕСТРЕНЕВЕРЬДНЕВНИКПИШЕШЬНЕТЫ";
 if(v===full_){give("cipher");save();closeM();render();showDoc("cipher")}
 else if(full_.startsWith(v)&&v.length>=9)$("cerr").textContent="Верно, но это не всё. Нужны все три книги.";
 else $("cerr").textContent="Не сходится. Выпишите подчёркнутые буквы на листок по порядку."}

/* ===================== ОКНА ===================== */
function openM(h){$("mbody").innerHTML=h;$("modal").classList.add("on")}
function closeM(){$("modal").classList.remove("on")}
$("modal").onclick=e=>{if(e.target.id==="modal")closeM()};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeM()});
function showDoc(k){const d=DOCS[k];openM(`<h3>${d.t}</h3><div class="sub">${d.s}</div>${d.b}`)}
function full(h){$("fullin").innerHTML=h;$("full").classList.add("on")}
function hideFull(){$("full").classList.remove("on")}
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),3200)}

function openFolder(){S.newF=0;save();drawClock();
 const docs=S.docs.map(k=>`<button onclick="showDoc('${k}')">📄 ${DOCS[k].t} <span style="color:#7a7264;font-size:13px">— ${DOCS[k].s}</span></button>`).join("");
 const books=S.items.filter(i=>i.startsWith("book_")).map(i=>`<button onclick="openM('<h3>${BOOKS[i.slice(5)].t}</h3>'+bookView('${i.slice(5)}'))">📕 Книга ${BOOKS[i.slice(5)].t}</button>`).join("");
 openM(`<h3>Папка</h3><div class="sub">Только документы и вещи. Выводы — на вашем листке.</div><div class="list">${docs}${books}</div>`)}
function openDiary(){S.newD=0;save();drawClock();
 openM(`<h3>Дневник следователя</h3><div class="sub">Сомов А.П.</div><div class="diary">${S.diary.map(e=>`<div class="ent ${e.drug?'drug':''}"><div class="date">${DAYS[e.d]}${e.drug?' · поздно вечером':''}</div>${e.txt}</div>`).join("")}</div>`)}

const FORM=[
 {l:"1. Что случилось с Верой Лапиной?",o:["Утонула в полынье","Ушла по льду на берег","Прячется в кочегарке у Михеича","Заперта в кабинете главврача"],a:2},
 {l:"2. Кто оставил следы и платок у полыньи?",o:["Сама Вера","Смотритель Ерёмин","Старшая медсестра Рябова","Санитар Тарасов"],a:2},
 {l:"3. Что происходило со следователем по вечерам?",o:["Обычная усталость","Ему подливали К-17 в чай и диктовали записи","Кто-то подделывал его почерк","Ему снились кошмары"],a:1},
 {l:"4. Ради чего всё это?",o:["Скрыть незаконные испытания К-17, о которых узнала Вера","Скрыть побег от начальства","Свалить вину на Михеича","Получить премию за план"],a:0},
 {l:"5. Кто за этим стоит?",o:["Рябова","Главврач Штерн","Доктор Зайцева","Тарасов"],a:1}
];
function openReport(forced){
 openM(`<h3>Отчёт следователя</h3><div class="sub">${forced?"Катер ждёт. Отчёт надо сдать сейчас.":"Можно сдать в любой момент. Дело закроется."}</div><div class="form">${FORM.map((q,i)=>`<label>${q.l}</label><select id="f${i}"><option value="">— выберите —</option>${q.o.map((t,j)=>`<option value="${j}">${t}</option>`).join("")}</select>`).join("")}</div>
 <button class="btn red" onclick="submit()">Подписать отчёт</button><div class="err" id="ferr"></div>`)}
function submit(){const v=FORM.map((q,i)=>$("f"+i).value);if(v.some(x=>x==="")){$("ferr").textContent="Заполните все пункты.";return}
 const r=FORM.filter((q,i)=>+v[i]===q.a).length;closeM();S.ended=1;save();
 const time=`Дней: ${S.day} · Документов найдено: ${S.docs.length} · Чай на второй вечер: ${S.flags.refused?"вылит":S.day>=3?"выпит":"—"}`;
 if(r===5){full(`<div class="tag">ДЕЛО ЗАКРЫТО · 5 ИЗ 5</div><h1>Вера уезжает с вами</h1>
 <p>Вы поднимаетесь на катер не один. Вера Лапина крепко держит свёрток со страницами журнала. Михеич машет с берега. Ольга Карповна смотрит из окна корпуса Б.</p>
 <p>Рябова сама вынесла платок к полынье в три часа ночи — в своих валенках, в белом халате, — и вернулась шаг в шаг. Она же подливала вам К-17 и диктовала записи. За всем стоял главврач Штерн: испытания без регистрации, на больных, без их ведома. Вера увидела журнал — и оказалась в палате №7.</p>
 <p style="font-family:IBM Plex Mono;font-size:14px">Через неделю диспансер закрыт. Штерн и Рябова арестованы. Тарасов и Михеич — свидетели.</p>
 <p style="font-size:14px">${time}</p>${S.flags.veraFound?"":"<p>Вы назвали всё верно, хотя саму Веру так и не нашли. Её привёл на причал Михеич.</p>"}
 <a class="btn" href="index.html#cases">К делам</a><button class="btn ghost" onclick="reset()">Сыграть заново</button>`)}
 else if(+v[0]===0){full(`<div class="tag">ВЕРНО ${r} ИЗ 5</div><h1>Акт о несчастном случае</h1>
 <p>Вы пишете: «Больная Лапина ушла по льду и утонула». Штерн благодарит вас, крепко жмёт руку. Катер отходит.</p>
 <p>Вы так и не узнаете, что в двухстах метрах, за котлом кочегарки, человек слышал гудок вашего катера — и понял, что за ней никто не придёт.</p>
 <p style="font-size:14px">${time}</p><button class="btn" onclick="reset()">Начать заново</button>`)}
 else{full(`<div class="tag">ВЕРНО ${r} ИЗ 5</div><h1>Прокурор возвращает отчёт</h1>
 <p>Часть выводов не подтверждается материалами. Штерн пишет жалобу на «некомпетентного следователя». Дело передают другому. Что станет с Верой — неизвестно.</p>
 <p style="font-size:14px">${time}</p><button class="btn" onclick="reset()">Начать заново</button>`)}
}

/* ===================== ПАНЕЛЬ ===================== */
function render(){drawMap();drawClock();
 const L=LOCS[S.loc];let h=`<h2>${L.n}</h2><div class="desc">${L.d}</div><div class="acts">`;
 (ACTS[S.loc]||[]).forEach((a,i)=>{const done=S.done.includes(a.id),lk=a.need&&!has(a.need);
  h+=`<button class="act ${done?'done':''} ${lk?'lock':''}" onclick="doAct(ACTS['${S.loc}'][${i}])"><span>${done&&a.doc?'↺ ':''}${a.t}</span><small>${done||!a.c?'':'+'+a.c+' мин'}</small></button>`});
 h+=`</div>`;
 const ppl=Object.keys(PEOPLE).filter(k=>PEOPLE[k].loc===S.loc&&!(k==="mih"&&S.flags.veraFound&&false));
 if(ppl.length){h+=`<div class="who">Здесь</div><div class="acts">`+ppl.map(k=>`<button class="act" onclick="talk('${k}')"><span>💬 ${PEOPLE[k].n}</span><small>15 мин / вопрос</small></button>`).join("")+`</div>`}
 h+=`<p class="sub" style="color:#7d8388;margin-top:22px;font-size:13px">Переход между зданиями — 30 минут. В 19:00 ужин. Катер — 16 марта в 19:00.</p>`;
 $("panel").innerHTML=h;
}

/* ===================== ЗВУК ===================== */
let AC=null,gain=null;
function toggleSound(){try{
 if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();const len=AC.sampleRate*4,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);let last=0;
  for(let i=0;i<len;i++){const w=Math.random()*2-1;last=(last+.02*w)/1.02;d[i]=last*3.5}
  const src=AC.createBufferSource();src.buffer=buf;src.loop=true;const f=AC.createBiquadFilter();f.type="lowpass";f.frequency.value=500;
  const lfo=AC.createOscillator(),lg=AC.createGain();lfo.frequency.value=.08;lg.gain.value=250;lfo.connect(lg);lg.connect(f.frequency);lfo.start();
  gain=AC.createGain();gain.gain.value=.5;src.connect(f);f.connect(gain);gain.connect(AC.destination);src.start();$("bSnd").textContent="🔊";return}
 if(AC.state==="running"){AC.suspend();$("bSnd").textContent="🔇"}else{AC.resume();$("bSnd").textContent="🔊"}}catch(e){toast("Звук недоступен в этом браузере.")}}

/* ===================== СТАРТ ===================== */
function snow(){const s=$("snow");for(let i=0;i<40;i++){const e=document.createElement("i");e.style.left=Math.random()*100+"%";e.style.animationDuration=(6+Math.random()*8)+"s";e.style.animationDelay=(-Math.random()*10)+"s";s.appendChild(e)}}
function askReset(){openM(`<h3>Начать заново?</h3><p>Весь прогресс будет потерян.</p><button class="btn red" onclick="reset()">Да, заново</button><button class="btn ghost" onclick="closeM()">Отмена</button>`)}
function reset(){S=fresh();save();closeM();hideFull();intro()}
function intro(){
 full(`<div class="tag">ТИХОЕ ДЕЛО · ДЕЛО № 4</div><h1>Остров на водохранилище</h1>
 <p>Март 1979 года. Ночью из запертой палаты закрытого диспансера на острове исчезла больная. Главврач говорит: ушла по льду и утонула. Начинается ледоход — остров отрезан на три дня.</p>
 <p>Вы — следователь Сомов. Последний катер только что ушёл.</p>
 <div class="paperhint">✎ Возьмите листок и ручку. Игра не записывает выводы за вас.</div><br><br>
 <button class="btn" onclick="S.started=1;save();hideFull();render();showDoc('order')">Сойти на причал</button>`);
}
snow();render();
if(!S.started)intro();else if(S.ended)openReport();else if(S.min>=19*60)evening();
</script>
